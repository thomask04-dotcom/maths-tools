<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Position Words</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #e5e7eb;background:#f8fafc;font-size:15px}
.title{font-weight:700;margin-right:6px;font-size:17px}
button{font:inherit;font-size:16px;padding:7px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1f2937;cursor:pointer}
button:hover{border-color:#94a3b8}
button.on{background:#2563eb;border-color:#2563eb;color:#fff}
#say{font-size:24px;padding:10px 14px;min-height:52px}
#opts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 8px}
#opts button{font-size:19px;font-weight:700}
#score{margin-left:auto;font-weight:700;font-size:18px}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{font-size:13px;color:#6b7280;padding:6px 10px}
</style></head><body>
<div class="bar"><span class="title">Position Words</span>
<button id="m1" class="on">🧸 Put the teddy…</button><button id="m2">❓ Where is the teddy?</button><button id="m3">Free play</button>
<span id="score">⭐ 0</span>
</div>
<div id="say"></div>
<div id="opts"></div>
<svg id="svg" viewBox="0 0 1000 470"></svg>
<div class="hint">Drag the teddy around the room. "Left" and "right" mean your left and right as you look at the screen. Hold up your left hand: it makes an L shape!</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,fs,fill,wt){const t=el('text',{x,y,'font-size':fs,fill:fill||'#1f2937','text-anchor':'middle','font-weight':wt||'normal','pointer-events':'none'},p);t.textContent=s;return t;}
function pt(svg,e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());}
const $=id=>document.getElementById(id);
const svg=$('svg');
const ZONES=[
 {w:'on the table',t:(x,y)=>x>=300&&x<=560&&y>=185&&y<250,p:[430,215]},
 {w:'under the table',t:(x,y)=>x>=320&&x<=540&&y>=275&&y<=420,p:[430,370]},
 {w:'above the table',t:(x,y)=>x>=300&&x<=560&&y<150,p:[430,90]},
 {w:'in the box',t:(x,y)=>x>=710&&x<=830&&y>=305&&y<=420,p:[770,370]},
 {w:'between the table and the box',t:(x,y)=>x>585&&x<690&&y>=280&&y<=430,p:[637,380]},
 {w:'to the left of the table',t:(x,y)=>x<280&&y>=250&&y<=430,p:[190,380]},
 {w:'to the right of the box',t:(x,y)=>x>860&&y>=260&&y<=430,p:[920,380]},
 {w:'on top of the box',t:(x,y)=>x>=710&&x<=830&&y>=230&&y<305,p:[770,265]}];
let teddy=[120,120],drag=null,mode='put',task=null,score=0;
function where(){return ZONES.filter(z=>z.t(...teddy)).map(z=>z.w);}
function render(){
  svg.innerHTML='';
  el('rect',{x:0,y:0,width:1000,height:430,fill:'#fef9c3'},svg);el('rect',{x:0,y:430,width:1000,height:40,fill:'#d6a570'},svg);
  // window
  el('rect',{x:60,y:40,width:140,height:110,fill:'#bae6fd',stroke:'#78350f','stroke-width':6},svg);el('line',{x1:130,x2:130,y1:40,y2:150,stroke:'#78350f','stroke-width':4},svg);
  // table
  el('rect',{x:290,y:250,width:280,height:22,rx:4,fill:'#92400e'},svg);el('rect',{x:305,y:272,width:18,height:158,fill:'#78350f'},svg);el('rect',{x:537,y:272,width:18,height:158,fill:'#78350f'},svg);
  // box (open)
  el('rect',{x:700,y:310,width:140,height:120,fill:'#d97706',stroke:'#78350f','stroke-width':3},svg);el('polygon',{points:'700,310 680,280 840,280 860,310',fill:'#f59e0b',stroke:'#78350f','stroke-width':3},svg);
  txt(svg,430,460,'table',15,'#fff','700');txt(svg,770,460,'box',15,'#fff','700');
  const inBox=ZONES[3].t(...teddy);
  const g=el('g',{style:'cursor:grab'},svg);el('rect',{x:teddy[0]-38,y:teddy[1]-38,width:76,height:76,fill:'transparent'},g);txt(g,teddy[0],teddy[1]+22,'🧸',64);
  if(inBox)el('rect',{x:700,y:360,width:140,height:70,fill:'#d97706',stroke:'#78350f','stroke-width':3},svg);
  g.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);e.preventDefault();});
}
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(svg,e);teddy=[Math.max(30,Math.min(970,p.x)),Math.max(30,Math.min(440,p.y))];render();});
svg.addEventListener('pointerup',()=>{if(!drag)return;drag=false;const w=where();
  if(mode==='put'&&task){if(w.includes(task)){score++;$('score').textContent='⭐ '+score;say(`✓ Yes! The teddy is <b>${task}</b>.`);setTimeout(newPut,1600);}else say(w.length?`The teddy is ${w[0]}. Put it <b>${task}</b>.`:`Put the teddy <b>${task}</b>.`);}
  if(mode==='free')say(w.length?`The teddy is <b>${w.join('</b> and <b>')}</b>.`:'Move the teddy near the table or the box.');});
function say(s){$('say').innerHTML=s;}
function newPut(){let z;do{z=ZONES[Math.floor(Math.random()*ZONES.length)];}while(task===z.w);task=z.w;teddy=[120,120];render();say(`Put the teddy <b>${task}</b>.`);}
function newWhere(){const z=ZONES[Math.floor(Math.random()*ZONES.length)];teddy=z.p.slice();render();say('Where is the teddy?');
  const O=$('opts');O.innerHTML='';const choices=[z,...ZONES.filter(q=>q!==z).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
  choices.forEach(c=>{const b=document.createElement('button');b.textContent='The teddy is '+c.w;b.onclick=()=>{if(c===z){score++;$('score').textContent='⭐ '+score;say(`✓ Yes! The teddy is <b>${z.w}</b>.`);O.innerHTML='';setTimeout(newWhere,1500);}else{b.disabled=true;b.style.opacity=.3;say('Look again. Where is the teddy?');}};O.appendChild(b);});}
function setMode(m){mode=m;['m1','m2','m3'].forEach((id,i)=>$(id).classList.toggle('on',['put','where','free'][i]===m));$('opts').innerHTML='';task=null;
  if(m==='put')newPut();if(m==='where')newWhere();if(m==='free'){render();say('Drag the teddy anywhere. Where is it?');}}
$('m1').onclick=()=>setMode('put');$('m2').onclick=()=>setMode('where');$('m3').onclick=()=>setMode('free');
setMode('put');
</script></body></html>
