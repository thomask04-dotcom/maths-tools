</style></head><body>

</div>
<!-- stage 2 modes -->
<div id="s2">
<div class="bar" id="b1"></div>
<div class="bar" id="b2"></div>
<div id="say"></div>
<svg id="svg2" viewBox="0 0 1000 600"></svg>
<div id="rec"></div>
<div class="hint" id="hint2"></div>
</div>
<div id="exAll" style="display:none">

</div>
<div class="bar">

/* ---------- SPLIT ---------- */
const SPS={square:[[0,0],[6,0],[6,6],[0,6]],rectangle:[[0,0],[8,0],[8,4],[0,4]],parallelogram:[[2,0],[8,0],[6,4],[0,4]],trapezium:[[2,0],[6,0],[8,4],[0,4]],
  rhombus:[[3,0],[6,4],[3,8],[0,4]],kite:[[3,0],[6,3],[3,8],[0,3]],triangle:[[4,0],[8,6],[0,6]],pentagon:[[0,3],[4,0],[8,3],[8,7],[0,7]],hexagon:[[2,0],[6,0],[8,3],[6,6],[2,6],[0,3]]};
const SU=50,SCOL=['#bfdbfe','#fde68a','#bbf7d0','#fbcfe8','#ddd6fe','#fed7aa','#a5f3fc','#fecaca'];
let sp={k:'rectangle',pcs:[],hist:[],first:null,apart:false,names:true,cuts:0};
function spReset(){const P=SPS[sp.k],w=Math.max(...P.map(p=>p[0])),h=Math.max(...P.map(p=>p[1])),ox=Math.round((20-w)/2),oy=Math.round((11.5-h)/2);sp.pcs=[P.map(p=>[p[0]+ox,p[1]+oy])];sp.hist=[];sp.first=null;sp.cuts=0;}
function onBoundary(q){return sp.pcs.some(P=>P.some((p,i)=>onSeg(q,p,P[(i+1)%P.length])));}
function segX(A,B,p,q){// intersection of segment AB with segment pq -> point or null
  const r=V(A,B),d=V(p,q),den=Cr(r,d);if(Math.abs(den)<1e-12)return null;const t=Cr(V(A,p),d)/den,u=Cr(V(A,p),r)/den;
  return t>-1e-9&&t<1+1e-9&&u>-1e-9&&u<1+1e-9?[A[0]+t*r[0],A[1]+t*r[1],t]:null;}
function cutPiece(P,A,B){const X=[];P.forEach((p,i)=>{const q=P[(i+1)%P.length],x=segX(A,B,p,q);if(x&&!X.some(y=>Math.hypot(y[0]-x[0],y[1]-x[1])<1e-6))X.push(x);});
  if(X.length<2)return null;X.sort((a,b)=>a[2]-b[2]);const C=[X[0][0],X[0][1]],D=[X[X.length-1][0],X[X.length-1][1]];if(Ln(V(C,D))<1e-6)return null;
  const m=[(C[0]+D[0])/2,(C[1]+D[1])/2];if(!inPoly(P,m[0]+1e-5,m[1]+1.3e-5)||!inPoly(P,m[0]-1e-5,m[1]-1.3e-5))return null;
  const Q=[];P.forEach((p,i)=>{const q=P[(i+1)%P.length];Q.push(p);[C,D].filter(Y=>onSeg(Y,p,q)&&Ln(V(Y,p))>1e-6&&Ln(V(Y,q))>1e-6).sort((Y,Z)=>Ln(V(p,Y))-Ln(V(p,Z))).forEach(Y=>Q.push(Y));});
  const ia=Q.findIndex(p=>Ln(V(p,C))<1e-6),ib=Q.findIndex(p=>Ln(V(p,D))<1e-6);if(ia<0||ib<0)return null;
  const p1=[],p2=[];for(let i=ia;;i=(i+1)%Q.length){p1.push(Q[i]);if(i===ib)break;}for(let i=ib;;i=(i+1)%Q.length){p2.push(Q[i]);if(i===ia)break;}
  const c1=clean(p1),c2=clean(p2);if(c1.length<3||c2.length<3||Math.abs(area(c1))<1e-6||Math.abs(area(c2))<1e-6)return null;return [c1,c2];}
function splitAt(A,B){const out=[];let n=0;sp.pcs.forEach(P=>{const r=cutPiece(P,A,B);if(r){out.push(...r);n++;}else out.push(P);});
  if(!n)return false;sp.hist.push(sp.pcs.map(x=>x.slice()));sp.pcs=out;sp.cuts++;return true;}
function splitBars(){$('b1').innerHTML='<span>Shape:</span>'+Object.keys(SPS).map(k=>`<button data-sp="${k}" class="${sp.k===k?'on':''}">${k}</button>`).join('');
  $('b2').innerHTML=`<button id="apBtn" class="${sp.apart?'on':''}">↔ Pull apart</button><button id="nmBtn" class="${sp.names?'on':''}">Names</button><button id="spUndo">↶ Undo</button><button id="spAgain">Start again</button><button id="spRec">📝 Record</button>`;
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{sp.k=b.dataset.sp;spReset();splitBars();draw();});
  $('apBtn').onclick=e=>{sp.apart=!sp.apart;sp.first=null;e.target.classList.toggle('on',sp.apart);draw();};$('nmBtn').onclick=e=>{sp.names=!sp.names;e.target.classList.toggle('on',sp.names);draw();};
  $('spUndo').onclick=()=>{if(sp.hist.length){sp.pcs=sp.hist.pop();sp.cuts--;}sp.first=null;draw();};$('spAgain').onclick=()=>{spReset();draw();};
  $('spRec').onclick=()=>{if(sp.pcs.length<2){$('say').innerHTML='Split the shape first, then record it.';return;}recs.split.push({img:thumb(sp.pcs,sp.pcs.map((_,i)=>SCOL[i%SCOL.length])),t:`${cap(art(sp.k))} split into ${countText(sp.pcs.map(shapeName))}.`});renderRec();};}
function drawSplit(){svg2.setAttribute('viewBox','0 0 1000 600');const g=svg2,C0=centroid(sp.pcs.flat());
  for(let x=0;x<=20;x++)for(let y=0;y<=12;y++)el('circle',{cx:x*SU,cy:y*SU,r:2,fill:'#cbd5e1'},g);
  sp.pcs.forEach((P,i)=>{const c=centroid(P),off=sp.apart?[(c[0]-C0[0])*.35,(c[1]-C0[1])*.35]:[0,0],Q=P.map(p=>[(p[0]+off[0])*SU,(p[1]+off[1])*SU]);
    poly(g,Q,{fill:SCOL[i%SCOL.length],stroke:'#1f2937','stroke-width':3});if(sp.apart)marks(g,Q,{eq:false,par:false,rt:true},1);
    if(sp.names&&sp.pcs.length>1){const cc=centroid(Q),nm=shapeName(P),small=Math.abs(area(P))<12,w=nm.split(' ');if(small&&w.length>1){txt(g,cc[0],cc[1]-2,w.slice(0,-1).join(' '),13,'#1f2937','700');txt(g,cc[0],cc[1]+13,w[w.length-1],13,'#1f2937','700');}else txt(g,cc[0],cc[1]+5,nm,small?13:15,'#1f2937','700');}});
  if(!sp.apart){for(let x=0;x<=20;x++)for(let y=0;y<=12;y++){if(!onBoundary([x,y]))continue;const f=sp.first&&sp.first[0]===x&&sp.first[1]===y;
      el('circle',{cx:x*SU,cy:y*SU,r:f?11:6,fill:f?'#dc2626':'#1f2937',stroke:'#fff','stroke-width':2,'pointer-events':'none'},g);}
    if(sp.first){el('circle',{cx:sp.first[0]*SU,cy:sp.first[1]*SU,r:20,fill:'none',stroke:'#dc2626','stroke-width':2,'stroke-dasharray':'4 4','pointer-events':'none'},g);}
    const hit=el('rect',{x:0,y:0,width:1000,height:600,fill:'transparent',style:'cursor:crosshair'},g);
    hit.addEventListener('pointerdown',e=>{const q=pt(svg2,e),X=[Math.round(q.x/SU),Math.round(q.y/SU)];if(Math.hypot(q.x/SU-X[0],q.y/SU-X[1])>.45||!onBoundary(X)){$('say').innerHTML='Tap a <b>dot on the edge</b> of the shape.';return;}
      if(!sp.first){sp.first=X;draw();return;}if(sp.first[0]===X[0]&&sp.first[1]===X[1]){sp.first=null;draw();return;}
      const ok=splitAt(sp.first,X);sp.first=null;draw();if(!ok)$('say').innerHTML='That line doesn\'t cut across the shape. Pick two dots on <b>different edges</b>.';});}
  let say;const nm=sp.pcs.map(shapeName);
  if(sp.pcs.length===1)say=sp.first?'Now tap another dot on a different edge to cut.':`Split the <b>${sp.k}</b>: tap a dot on one edge, then a dot on another edge to cut a straight line.`;
  else say=`The ${sp.k} has been split into <b>${countText(nm)}</b>. `+(sp.first?'Tap another dot to finish the cut.':'Cut again, press ↔ Pull apart to see the pieces, or 📝 Record.');
  $('say').innerHTML=say;}

/* ---------- modes ---------- */
const HINT2={cmp:'Equal sides have matching tick marks, parallel sides have matching green arrows, and right angles have a red square. Tap a shape to describe it, tap two to compare. Group the shapes by one or two features (a Carroll diagram).',
  comb:'Drag pieces into the outline. Tap a piece to choose it, then ↻ Turn or ⇋ Flip it. Pieces snap to the dots. When the outline is filled exactly (no gaps, no overlaps), press 📝 Record.',
  split:'Tap a dot on one edge, then a dot on another edge, to cut the shape with a straight line. Each piece is named. Cut more than once to make more pieces.'};
function draw(){if(mode==='ex')return;svg2.innerHTML='';if(mode==='cmp')drawCmp();if(mode==='comb')drawComb();if(mode==='split')drawSplit();}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('s2').style.display=m==='ex'?'none':'';$('exAll').style.display=m==='ex'?'':'none';
  if(m==='cmp')cmpBars();if(m==='comb'){if(!cb.pcs.length)CH[cb.ch].use.forEach(addPiece);cb.sel=-1;combBars();}if(m==='split'){if(!sp.pcs.length)spReset();splitBars();}
  if(m!=='ex')$('hint2').textContent=HINT2[m];renderRec();draw();if(m==='ex')render();}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
setMode('cmp');
</script></body></html>
