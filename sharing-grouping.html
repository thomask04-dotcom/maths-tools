<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharing & Grouping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #e5e7eb;background:#f8fafc;font-size:15px}
.title{font-weight:700;margin-right:6px;font-size:17px}
button{font:inherit;font-size:15px;padding:6px 11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1f2937;cursor:pointer}
button:hover{border-color:#94a3b8}
button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.v{font-size:20px;font-weight:800;min-width:30px;text-align:center}
.go{font-weight:700;background:#16a34a;border-color:#16a34a;color:#fff}
#say{font-size:21px;padding:8px 14px;min-height:46px;line-height:1.5}
svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.hint{font-size:13px;color:#6b7280;padding:6px 10px}
</style></head><body>
<div class="bar"><span class="title">Sharing & Grouping</span>
<button data-m="share" class="on">Share equally</button><button data-m="group">Make equal groups</button>
</div>
<div class="bar">
<span>Things:</span><button data-v="n,-1">−</button><span class="v" id="vn"></span><button data-v="n,1">+</button>
<span id="kLab">Plates:</span><button data-v="k,-1">−</button><span class="v" id="vk"></span><button data-v="k,1">+</button>
<button class="go" id="oneBtn">Deal one</button><button class="go" id="allBtn">Deal them all</button><button id="backBtn">Put them back together</button>
<button id="divBtn">Show division (÷)</button>
</div>
<div id="say"></div>
<svg id="svg" viewBox="0 0 1000 560"></svg>
<div class="hint">Share equally: deal the things out one at a time, like dealing cards, until there aren't enough left to go round. Make equal groups: take a group of the same size each time. Then put them back together. Sharing and grouping are two kinds of division.</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,fs,fill,wt,anchor){const t=el('text',{x,y,'font-size':fs,fill:fill||'#1f2937','text-anchor':anchor||'middle','font-weight':wt||'normal','pointer-events':'none'},p);t.textContent=s;return t;}
const $=id=>document.getElementById(id);
const svg=$('svg');
let mode='share',n=12,k=3,dealt=[],pile=12,timer=null,showDiv=false,next=0;
function reset(){clearInterval(timer);timer=null;pile=n;next=0;dealt=mode==='share'?Array(k).fill(0):[];update();}
function item(x,y,r,col){el('circle',{cx:x,cy:y,r,fill:col||'#f59e0b',stroke:'#92400e','stroke-width':2},svg);el('circle',{cx:x-r*0.3,cy:y-r*0.3,r:r*0.25,fill:'#fff',opacity:.5},svg);}
function render(){
  svg.innerHTML='';
  el('rect',{x:20,y:20,width:960,height:150,rx:16,fill:'#f1f5f9',stroke:'#cbd5e1','stroke-width':2},svg);txt(svg,40,48,`Still to ${mode==='share'?'share':'group'}: ${pile}`,16,'#475569','700','start');
  for(let i=0;i<pile;i++){const c=i%20,r=Math.floor(i/20);item(60+c*46,80+r*40,15);}
  if(mode==='share'){
    const cols=Math.min(k,5),rows=Math.ceil(k/5),pw=Math.min(180,920/cols),ph=rows>1?170:320;svg.setAttribute('viewBox',`0 0 1000 ${200+rows*(ph+20)}`);
    for(let p=0;p<k;p++){const cx=40+(p%5)*(pw+10)+pw/2,cy=200+Math.floor(p/5)*(ph+20)+ph/2;
      el('ellipse',{cx,cy,rx:pw/2-4,ry:ph/2-6,fill:'#fff',stroke:'#64748b','stroke-width':3},svg);el('ellipse',{cx,cy,rx:pw/2-22,ry:ph/2-24,fill:'none',stroke:'#e2e8f0','stroke-width':2},svg);
      const m=dealt[p],per=4,r=Math.min(14,pw/12);for(let i=0;i<m;i++){const col=i%per,row=Math.floor(i/per),inRow=Math.min(per,m-row*per);item(cx+(col-(inRow-1)/2)*(2*r+6),cy-ph/2+40+row*(2*r+6),r);}
      txt(svg,cx,cy+ph/2+2-(rows>1?-10:0),String(m),20,'#111827','800');}
  } else {
    const g=k,groups=dealt.length,cols=Math.min(Math.max(groups,1),6),gw=Math.min(150,920/Math.max(cols,1)),rows=Math.max(1,Math.ceil(groups/6)),gh=Math.max(90,Math.ceil(g/3)*36+30);svg.setAttribute('viewBox',`0 0 1000 ${210+rows*(gh+16)}`);
    for(let q=0;q<groups;q++){const x=40+(q%6)*(gw+10),y=200+Math.floor(q/6)*(gh+16);el('rect',{x,y,width:gw,height:gh,rx:14,fill:'#fff',stroke:'#64748b','stroke-width':3},svg);
      for(let i=0;i<g;i++){const c=i%3,r=Math.floor(i/3);item(x+gw/2+(c-1)*34,y+24+r*34,13,'#60a5fa');}txt(svg,x+gw/2,y+gh-8,'group '+(q+1),13,'#475569','700');}
  }
}
function done(){return mode==='share'?pile<k:pile<k;}
function sentence(){
  const q=mode==='share'?Math.floor(n/k):dealt.length,r=pile,fin=done();
  let s='';
  if(mode==='share'){
    if(!fin)s=`Sharing ${n} between ${k}. Keep dealing, one each time around.`;
    else s=`${n} shared equally between ${k}: each gets <b>${q}</b>`+(r?` and there ${r===1?'is':'are'} <b>${r} left over</b>.`:'. None left over.');
    if(fin&&k===2&&!r)s+=` Half of ${n} is ${q}.`;
    if(fin&&showDiv)s+=`<br><b>${n} ÷ ${k} = ${q}${r?` remainder ${r}`:''}</b> &nbsp; (${n} = ${k} × ${q}${r?' + '+r:''})`;
  } else {
    if(!fin)s=`Making groups of ${k} from ${n}. Keep making groups.`;
    else s=`${n} makes <b>${q} group${q===1?'':'s'} of ${k}</b>`+(r?` with <b>${r} left over</b>.`:'.');
    if(fin&&showDiv)s+=`<br><b>${n} ÷ ${k} = ${q}${r?` remainder ${r}`:''}</b> &nbsp; (${n} = ${q} × ${k}${r?' + '+r:''})`;
  }
  return s;
}
function update(){$('vn').textContent=n;$('vk').textContent=k;$('kLab').textContent=mode==='share'?'Plates:':'In each group:';$('say').innerHTML=sentence();render();}
function step(){
  if(done()){clearInterval(timer);timer=null;update();return false;}
  if(mode==='share'){dealt[next]++;pile--;next=(next+1)%k;}else{dealt.push(k);pile-=k;}
  update();return true;
}
$('oneBtn').onclick=()=>{clearInterval(timer);timer=null;step();};
$('allBtn').onclick=()=>{clearInterval(timer);timer=setInterval(()=>{if(!step()){clearInterval(timer);timer=null;}},mode==='share'?160:420);};
$('backBtn').onclick=()=>{const q=mode==='share'?Math.min(...dealt):dealt.length,r=pile;reset();
  $('say').innerHTML=(mode==='share'?`Putting them back: ${k} plates with ${q} each`:`Putting them back: ${q} groups of ${k}`)+(r?` and ${r} more`:'')+` make <b>${n}</b> again.`;};
$('divBtn').onclick=e=>{showDiv=!showDiv;e.target.classList.toggle('on',showDiv);update();};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const [key,d]=b.dataset.v.split(',');if(key==='n')n=Math.max(1,Math.min(60,n+ +d));else k=Math.max(mode==='share'?2:2,Math.min(mode==='share'?10:12,k+ +d));reset();});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));$('oneBtn').textContent=mode==='share'?'Deal one':'Make a group';$('allBtn').textContent=mode==='share'?'Deal them all':'Make all the groups';reset();});
reset();
</script></body></html>
