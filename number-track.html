<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Track</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #e5e7eb;background:#f8fafc;font-size:15px}
.title{font-weight:700;margin-right:6px;font-size:17px}
button{font:inherit;font-size:16px;padding:8px 14px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1f2937;cursor:pointer}
button:hover{border-color:#94a3b8}
button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.big{font-size:20px;font-weight:700;min-width:64px}
#say{font-size:24px;padding:10px 14px;min-height:50px}
#opts{display:flex;flex-wrap:wrap;gap:10px;padding:6px 14px}
#opts button{font-size:28px;font-weight:800;width:76px;height:70px}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{font-size:13px;color:#6b7280;padding:6px 10px}
</style></head><body>
<div class="bar"><span class="title">Number Track</span>
<button data-r="0,10">0 to 10</button><button data-r="1,20" class="on">1 to 20</button><button data-r="0,20">0 to 20</button>
<button id="hideBtn">Hide numbers</button>
<button id="paintBtn">🖌 Colour squares</button>
<button id="clearBtn">Clear colours</button>
</div>
<div class="bar">
<span>Move the frog:</span>
<button class="big" data-j="-2">−2</button><button class="big" data-j="-1">−1</button><button class="big" data-j="1">+1</button><button class="big" data-j="2">+2</button><button class="big" data-j="10">+10</button>
<button id="missBtn">❓ Missing number game</button>
</div>
<div id="say"></div>
<svg id="svg"></svg>
<div id="opts"></div>
<div class="hint">Tap a square to hop the frog there. Turn on "Colour squares" to colour squares instead. With numbers hidden, tap a square to peek at its number.</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,fs,fill,wt){const t=el('text',{x,y,'font-size':fs,fill:fill||'#1f2937','text-anchor':'middle','font-weight':wt||'normal','pointer-events':'none'},p);t.textContent=s;return t;}
const $=id=>document.getElementById(id);
const svg=$('svg'),S=88,SH=124,G=8;
let lo=1,hi=20,frog=1,hide=false,paint=false,painted=new Set(),peek=new Set(),miss=null,trail=null;
function pos(v){const i=v-lo,per=lo===0&&hi===20?11:10;const row=Math.floor(i/per),col=i%per;return [20+col*(S+G),20+row*(SH+G+14)];}
function render(){
  svg.innerHTML='';const per=lo===0&&hi===20?11:10,rows=Math.ceil((hi-lo+1)/per);
  svg.setAttribute('viewBox',`0 0 ${40+per*(S+G)} ${40+rows*(SH+G+14)}`);
  for(let v=lo;v<=hi;v++){
    const [x,y]=pos(v),g=el('g',{style:'cursor:pointer'},svg);
    const isMiss=miss&&v===miss.v;
    el('rect',{x,y,width:S,height:SH,rx:12,fill:isMiss?'#fef3c7':painted.has(v)?'#fca5a5':(v%10===0?'#e0f2fe':'#fff'),stroke:isMiss?'#d97706':'#1e3a8a','stroke-width':isMiss?4:2.5},g);
    const show=!isMiss&&(!hide||peek.has(v)||v===frog&&!hide);
    txt(g,x+S/2,y+54,isMiss?'?':(show&&!hide)||peek.has(v)?String(v):'',40,isMiss?'#d97706':'#111827','700');
    g.addEventListener('pointerdown',()=>tap(v));
  }
  if(trail){const [x1,y1]=pos(trail[0]),[x2,y2]=pos(trail[1]);if(y1===y2){const mx=(x1+x2)/2+S/2,h=Math.min(60,20+Math.abs(x2-x1)*0.2);el('path',{d:`M${x1+S/2} ${y1+4} Q${mx} ${y1-h} ${x2+S/2} ${y2+4}`,fill:'none',stroke:'#16a34a','stroke-width':4,'stroke-dasharray':'8 6','pointer-events':'none'},svg);}}
  const [fx,fy]=pos(frog);drawFrog(fx+S/2,fy+SH-24);
}
function drawFrog(x,y){
  const g=el('g',{'pointer-events':'none'},svg);
  el('ellipse',{cx:x,cy:y,rx:26,ry:18,fill:'#22c55e',stroke:'#15803d','stroke-width':3},g);
  for(const dx of [-12,12]){el('circle',{cx:x+dx,cy:y-16,r:9,fill:'#22c55e',stroke:'#15803d','stroke-width':3},g);el('circle',{cx:x+dx,cy:y-16,r:4,fill:'#111827'},g);}
  el('path',{d:`M${x-10} ${y+4} Q${x} ${y+12} ${x+10} ${y+4}`,fill:'none',stroke:'#14532d','stroke-width':2.5},g);
}
function say(s){$('say').innerHTML=s;}
function tap(v){
  if(miss)return;
  if(paint){painted.has(v)?painted.delete(v):painted.add(v);render();return;}
  if(hide){peek.has(v)?peek.delete(v):peek.add(v);}
  hop(v);
}
function hop(v){const from=frog;frog=v;trail=from!==v?[from,v]:null;const d=v-from;
  say(d===0?`The frog is on <b>${hide&&!peek.has(v)?'?':v}</b>.`:hide?`The frog jumped ${d>0?'forward':'back'} ${Math.abs(d)}.`:`${from} ${d>0?'+':'−'} ${Math.abs(d)} = <b>${v}</b>`);render();}
document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{if(miss)return;const v=frog+ +b.dataset.j;if(v<lo||v>hi){say('Oops! The frog would fall off the track.');return;}hop(v);});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{[lo,hi]=b.dataset.r.split(',').map(Number);document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));frog=lo;painted.clear();peek.clear();miss=null;trail=null;$('opts').innerHTML='';say('');render();});
$('hideBtn').onclick=e=>{hide=!hide;peek.clear();e.target.classList.toggle('on',hide);render();};
$('paintBtn').onclick=e=>{paint=!paint;e.target.classList.toggle('on',paint);};
$('clearBtn').onclick=()=>{painted.clear();render();};
$('missBtn').onclick=()=>{
  if(hide){hide=false;$('hideBtn').classList.remove('on');}
  let v;do{v=lo+1+Math.floor(Math.random()*(hi-lo-1));}while(miss&&v===miss.v);
  miss={v};trail=null;say('Which number is hiding under the <b>?</b>');
  const set=new Set([v]);while(set.size<4){const d=[-2,-1,1,2,10,-10][Math.floor(Math.random()*6)],w=v+d;if(w>=lo&&w<=hi)set.add(w);}
  const O=$('opts');O.innerHTML='';[...set].sort(()=>Math.random()-.5).forEach(w=>{const b=document.createElement('button');b.textContent=w;b.onclick=()=>{
    if(w===v){say(`✓ Yes! <b>${v}</b> comes after ${v-1} and before ${v+1}.`);miss=null;O.innerHTML='';hop2(v);}
    else{say(`Not ${w}. Look at the numbers either side of the <b>?</b>`);b.disabled=true;b.style.opacity=.35;}
  };O.appendChild(b);});
  render();
};
function hop2(v){frog=v;trail=null;render();}
say('Tap a square to make the frog hop.');render();
</script></body></html>
