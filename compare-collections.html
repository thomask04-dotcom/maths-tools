<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare Collections</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #e5e7eb;background:#f8fafc;font-size:15px}
.title{font-weight:700;margin-right:6px;font-size:17px}
button{font:inherit;font-size:16px;padding:7px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1f2937;cursor:pointer}
button:hover{border-color:#94a3b8}
button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.v{font-size:22px;font-weight:800;min-width:30px;text-align:center}
#say{font-size:22px;padding:8px 14px;min-height:46px}
#opts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 8px}
#opts button{font-size:22px;font-weight:800;min-width:60px;padding:8px 14px}
svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.hint{font-size:13px;color:#6b7280;padding:6px 10px}
</style></head><body>
<div class="bar"><span class="title">Compare Collections</span>
<span style="color:#dc2626;font-weight:700">Red</span><button data-v="a,-1">−</button><span class="v" id="va"></span><button data-v="a,1">+</button>
<span style="color:#2563eb;font-weight:700">Blue</span><button data-v="b,-1">−</button><span class="v" id="vb"></span><button data-v="b,1">+</button>
<button id="lineBtn">↔ Line them up</button>
</div>
<div class="bar"><button id="q1">❓ Which has more?</button><button id="q2">❓ How many more?</button><button id="showBtn">Show numbers</button></div>
<div id="say"></div>
<div id="opts"></div>
<svg id="svg" viewBox="0 0 1000 380"></svg>
<div class="hint">When the counters are jumbled up it's hard to compare them. Line them up and match them one-to-one: the ones with no partner are the extra ones. That's how many more.</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,fs,fill,wt,anchor){const t=el('text',{x,y,'font-size':fs,fill:fill||'#1f2937','text-anchor':anchor||'middle','font-weight':wt||'normal','pointer-events':'none'},p);t.textContent=s;return t;}
const $=id=>document.getElementById(id);
const svg=$('svg');
let a=7,b=4,lined=false,showN=false,pos={a:[],b:[]},t=0,anim=null,q=null;
function scatter(n,y0){const out=[];let tries=0;while(out.length<n&&tries<4000){tries++;const x=80+Math.random()*840,y=y0+20+Math.random()*110;if(out.every(p=>Math.hypot(p[0]-x,p[1]-y)>42))out.push([x,y]);}while(out.length<n)out.push([80+out.length*40,y0+70]);return out;}
function reshuffle(){pos.a=scatter(a,10);pos.b=scatter(b,200);}
function render(){
  svg.innerHTML='';
  el('rect',{x:10,y:8,width:980,height:170,rx:16,fill:'#fef2f2'},svg);el('rect',{x:10,y:198,width:980,height:170,rx:16,fill:'#eff6ff'},svg);
  const S=Math.min(46,880/Math.max(a,b,1)),X=i=>70+i*S+S/2,YA=93,YB=283;
  const at=(arr,i,y)=>{const [sx,sy]=arr[i]||[X(i),y];return [sx+(X(i)-sx)*t,sy+(y-sy)*t];};
  if(t>0.99)for(let i=0;i<Math.min(a,b);i++)el('line',{x1:X(i),x2:X(i),y1:YA+20,y2:YB-20,stroke:'#94a3b8','stroke-width':2,'stroke-dasharray':'4 4'},svg);
  const r=Math.min(18,S*0.42);
  for(let i=0;i<a;i++){const [x,y]=at(pos.a,i,YA);el('circle',{cx:x,cy:y,r,fill:'#ef4444',stroke:t>0.99&&i>=b?'#111827':'#7f1d1d','stroke-width':t>0.99&&i>=b?4:2},svg);}
  for(let i=0;i<b;i++){const [x,y]=at(pos.b,i,YB);el('circle',{cx:x,cy:y,r,fill:'#3b82f6',stroke:t>0.99&&i>=a?'#111827':'#1e3a8a','stroke-width':t>0.99&&i>=a?4:2},svg);}
  if(t>0.99&&a!==b){const lo=Math.min(a,b),hi=Math.max(a,b),y=a>b?YA-36:YB+44;el('path',{d:`M${X(lo)-S/2} ${y} h${(hi-lo)*S}`,stroke:'#111827','stroke-width':3},svg);txt(svg,X(lo)-S/2+(hi-lo)*S/2,a>b?y-8:y+22,`${hi-lo} extra`,17,'#111827','800');}
  if(showN){txt(svg,960,YA+8,String(a),28,'#b91c1c','800','end');txt(svg,960,YB+8,String(b),28,'#1d4ed8','800','end');}
  $('va').textContent=a;$('vb').textContent=b;
}
function animate(to){cancelAnimationFrame(anim);const from=t,t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/700);t=from+(to-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);render();if(k<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
function say(s){$('say').innerHTML=s;}
document.querySelectorAll('[data-v]').forEach(bt=>bt.onclick=()=>{const [k,d]=bt.dataset.v.split(',');if(k==='a')a=Math.max(0,Math.min(20,a+ +d));else b=Math.max(0,Math.min(20,b+ +d));reshuffle();q=null;$('opts').innerHTML='';render();});
$('lineBtn').onclick=e=>{lined=!lined;e.target.classList.toggle('on',lined);animate(lined?1:0);if(lined&&!q)say(a===b?'They match up exactly, so they are the same!':`${a>b?'Red':'Blue'} has ${Math.abs(a-b)} more than ${a>b?'blue':'red'}.`);};
$('showBtn').onclick=e=>{showN=!showN;e.target.classList.toggle('on',showN);render();};
function newPair(){do{a=2+Math.floor(Math.random()*11);b=2+Math.floor(Math.random()*11);}while(a===b&&Math.random()<.8);reshuffle();lined=false;$('lineBtn').classList.remove('on');t=0;render();}
$('q1').onclick=()=>{newPair();q='which';say('Which colour has more counters?');const O=$('opts');O.innerHTML='';
  [['Red','a'],['Blue','b'],['The same','s']].forEach(([l,k])=>{const bt=document.createElement('button');bt.textContent=l;bt.onclick=()=>{const ans=a>b?'a':b>a?'b':'s';if(k===ans){say('✓ Yes! Line them up to check.');O.innerHTML='';lined=true;$('lineBtn').classList.add('on');animate(1);}else{bt.disabled=true;bt.style.opacity=.3;say('Hmm, try lining them up.');}};O.appendChild(bt);});};
$('q2').onclick=()=>{newPair();if(a===b)b=a-2;reshuffle();render();q='how';const big=a>b?'red':'blue',small=a>b?'blue':'red';say(`How many more ${big} counters are there than ${small}?`);const O=$('opts');O.innerHTML='';
  for(let i=0;i<=10;i++){const bt=document.createElement('button');bt.textContent=i;bt.onclick=()=>{if(i===Math.abs(a-b)){say(`✓ Yes! There are ${i} more ${big}. ${Math.max(a,b)} is ${i} more than ${Math.min(a,b)}.`);O.innerHTML='';lined=true;$('lineBtn').classList.add('on');animate(1);}else{bt.disabled=true;bt.style.opacity=.3;say('Not quite. Line them up and count the ones with no partner.');}};O.appendChild(bt);}};
reshuffle();render();say('Which row has more? Press "Line them up" to match them one-to-one.');
</script></body></html>
